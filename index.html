<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>EMG Monitoring Dashboard</title>\n    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>\n    <style>\n        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; }\n        canvas { max-width: 800px; }\n        #dashboard { margin: 20px; }\n        .patient-switch { margin: 10px; }\n    </style>\n</head>\n<body>\n    <div id="dashboard">\n        <h1>EMG Monitoring Dashboard</h1>\n        <div class="patient-switch">\n            <label for="patients">Switch Patient: </label>\n            <select id="patients">\n                <option value="patient1">Patient 1</option>\n                <option value="patient2">Patient 2</option>\n                <option value="patient3">Patient 3</option>\n            </select>\n        </div>\n        <canvas id="emgChart"></canvas>\n    </div>\n    <script>\n        const ctx = document.getElementById('emgChart').getContext('2d');\n        let emgData = { x: [], y: [] };\n        const emgChart = new Chart(ctx, {\n            type: 'line',\n            data: {\n                datasets: [{\n                    label: 'EMG Data',\n                    borderColor: 'rgba(75, 192, 192, 1)',\n                    borderWidth: 1,\n                    fill: false,\n                    data: []\n                }]\n            },\n            options: {\n                scales: {\n                    x: { type: 'realtime' },\n                    y: { beginAtZero: true }\n                }\n            }\n        });\n\n        function fetchFakeData() {\n            // Simulating real-time data fetch\n            const timestamp = new Date();\n            const value = Math.random() * 100;\n            emgData.x.push(timestamp);\n            emgData.y.push(value);\n            emgChart.data.datasets[0].data = emgData.y.map((y, index) => ({ x: emgData.x[index], y }));\n            emgChart.update();\n        }\n\n        setInterval(fetchFakeData, 1000);\n\n        document.getElementById('patients').addEventListener('change', (event) => {\n            alert('Switched to ' + event.target.value);\n        });\n    </script>\n</body>\n</html>
