<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMG Monitoring Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <h1>EMG Monitoring System</h1>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Reports</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </nav>
    
    <!-- Main Dashboard -->
    <div class="dashboard">
        <!-- Patient Sidebar -->
        <aside class="patient-sidebar">
            <h2>Patient Information</h2>
            <div class="patient-card">
                <p><strong>Name:</strong> John Doe</p>
                <p><strong>Age:</strong> 30</p>
                <p><strong>Condition:</strong> Healthy</p>
            </div>
        </aside>
        
        <!-- Real-time EMG Chart -->
        <section class="emg-chart">
            <h2>Real-Time EMG Data</h2>
            <canvas id="emgCanvas"></canvas>
        </section>
        
        <!-- Movement Status Indicator -->
        <section class="movement-status">
            <h2>Movement Status</h2>
            <p id="movementStatus">No Movement Detected</p>
        </section>
        
        <!-- Statistics Grid -->
        <section class="statistics">
            <h2>Statistics</h2>
            <table>
                <tr><th>Average</th><th>Peak</th><th>Duration</th></tr>
                <tr><td id="averageValue">0.00</td><td id="peakValue">0.00</td><td id="durationValue">0s</td></tr>
            </table>
        </section>
    </div>
    
    <!-- Interactive Controls -->
    <div class="controls">
        <button id="refreshButton">Refresh</button>
        <button id="addReadingButton">Add Reading</button>
        <button id="clearDataButton">Clear Data</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
